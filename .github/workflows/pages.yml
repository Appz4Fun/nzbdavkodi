name: Docs

# Builds the MkDocs (Material) documentation site and publishes it to GitHub
# Pages. This repository no longer self-hosts a Kodi add-on repository on Pages;
# add-on distribution now lives in the multi-channel Appz4Fun Kodi repository at
# https://github.com/Appz4Fun/Appz4Fun-Kodi-Repo (served from its own Pages
# site). GitHub Pages for THIS repository serves user + technical documentation.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "mkdocs.yml"
      - "docs-site/**"
      - "requirements-docs.txt"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Allow only one concurrent deployment; skip queued runs in between.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Docs-only build and upload; no authenticated git operations are
          # needed, so don't persist the default GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation toolchain
        run: pip install -r requirements-docs.txt

      - name: Build site (strict)
        # --strict fails the build on broken internal links or nav entries that
        # point at missing pages, so a typo cannot silently ship a broken site.
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
