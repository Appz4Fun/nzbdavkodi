---
engines:
  pylint:
    enabled: true
    exclude_paths:
      - "tests/**"
      - "tests-extensive/**"
      - "plugin.video.nzbdav/resources/lib/ptt/**"
      - "repo/plugin.video.nzbdav/resources/lib/ptt/**"
      - "scripts/**"
  bandit:
    enabled: true
    # scripts/ is dev tooling, not shipped code: CI's bandit.yml scans only
    # repo/plugin.video.nzbdav/ (and skips B603 there), matching the repo's
    # security-scan scope. Keep the Codacy engine aligned so list-form
    # subprocess calls in helper scripts don't trip the PR issue gate.
    exclude_paths:
      - "tests/**"
      - "tests-extensive/**"
      - "scripts/**"
      - "plugin.video.nzbdav/resources/lib/ptt/**"
      - "repo/plugin.video.nzbdav/resources/lib/ptt/**"
  # Prospector's only output unique to this Kodi addon is pydocstyle (hundreds of
  # missing-docstring nits) and pyright (hundreds of "could not be resolved"
  # errors against the runtime-only xbmc* modules and the resources.lib namespace
  # package). Neither belongs to this project's quality bar: ruff lints only
  # E/F/W/I (no docstring rules) and pylint runs separately at 10/10 via .pylintrc.
  # Prospector's remaining checks (its bundled bandit/pylint/pyflakes/mccabe) are
  # redundant with the standalone Bandit and Pylint engines, which stay enabled on
  # the library. Codacy's config file cannot disable a tool (only the Code Patterns
  # UI can), so scope Prospector away from the shipped library to drop the
  # out-of-bar false positives. Security coverage is unchanged: standalone Bandit
  # here plus bandit.yml, semgrep.yml and codeql.yml in CI.
  prospector:
    enabled: true
    exclude_paths:
      - "tests/**"
      - "tests-extensive/**"
      - "plugin.video.nzbdav/resources/lib/ptt/**"
      - "repo/plugin.video.nzbdav/resources/lib/ptt/**"
      - "scripts/**"
      - "repo/plugin.video.nzbdav/**"
  # The shipped library is back under cloud Lizard enforcement. The A1-A4
  # param-bundling / decomposition refactors removed the parameter-count and
  # file-nloc floor the old exclusion defended; the two remaining shipped-lib
  # findings (_serve_proxy CCN 9, _discovered_video_is_stub CCN 9) are
  # individually accepted — splitting either harms readability of a cohesive
  # state machine / rejection predicate. .pylintrc re-enables
  # too-many-arguments at the same threshold (max-args=8). Tests stay excluded
  # pending the Phase C test-suite wave (fixture consolidation + giant-file
  # splits); the vendored ptt exclusion is permanent.
  lizard:
    exclude_paths:
      - "tests/**"
      - "tests-extensive/**"
      - "plugin.video.nzbdav/resources/lib/ptt/**"
      - "repo/plugin.video.nzbdav/resources/lib/ptt/**"
  # Codacy enables Trivy (dependency/vuln scanner) by default, but no patterns are
  # configured for it in this project, so it aborts ("Failed to configure Codacy
  # Trivy: no patterns configured") and reds both the Codacy Security Scan workflow
  # AND the app-side Codacy Static Code Analysis check. Our security coverage is
  # pylint/prospector/bandit here plus bandit.yml, semgrep.yml and codeql.yml in
  # CI, so disable the misconfigured engine rather than let it fail the pipeline.
  trivy:
    enabled: false
exclude_paths:
  - "plugin.video.nzbdav/resources/lib/ptt/**"
  - "repo/plugin.video.nzbdav/resources/lib/ptt/**"
  - "tests/**"
  - "tests-extensive/**"
  - "mockups/**"
  - "docs/**"
  # docs-site/ is the MkDocs (Material) documentation source published to GitHub
  # Pages. markdownlint's defaults conflict with Material syntax (grid cards
  # require inline HTML / MD033, 3-space list markers / MD030, and __bold__ /
  # MD050), and the site is validated separately by `mkdocs build --strict`
  # (broken links/nav) plus mermaid diagram validation. Exclude it the same way
  # docs/** is excluded so doc-style nits don't red the gate.
  - "docs-site/**"
