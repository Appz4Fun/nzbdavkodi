---
engines:
  pylint:
    enabled: true
    exclude_paths:
      - "tests/**"
      - "tests-extensive/**"
      - "plugin.video.nzbdav/resources/lib/ptt/**"
      - "repo/plugin.video.nzbdav/resources/lib/ptt/**"
      - "scripts/**"
  bandit:
    enabled: true
    exclude_paths:
      - "tests/**"
      - "tests-extensive/**"
      - "plugin.video.nzbdav/resources/lib/ptt/**"
      - "repo/plugin.video.nzbdav/resources/lib/ptt/**"
  # Prospector's only output unique to this Kodi addon is pydocstyle (hundreds of
  # missing-docstring nits) and pyright (hundreds of "could not be resolved"
  # errors against the runtime-only xbmc* modules and the resources.lib namespace
  # package). Neither belongs to this project's quality bar: ruff lints only
  # E/F/W/I (no docstring rules) and pylint runs separately at 10/10 via .pylintrc.
  # Prospector's remaining checks (its bundled bandit/pylint/pyflakes/mccabe) are
  # redundant with the standalone Bandit and Pylint engines, which stay enabled on
  # the library. Codacy's config file cannot disable a tool (only the Code Patterns
  # UI can), so scope Prospector away from the shipped library to drop the
  # out-of-bar false positives. Security coverage is unchanged: standalone Bandit
  # here plus bandit.yml, semgrep.yml and codeql.yml in CI.
  prospector:
    enabled: true
    exclude_paths:
      - "tests/**"
      - "tests-extensive/**"
      - "plugin.video.nzbdav/resources/lib/ptt/**"
      - "repo/plugin.video.nzbdav/resources/lib/ptt/**"
      - "scripts/**"
      - "repo/plugin.video.nzbdav/**"
  # Lizard's default "medium" thresholds contradict this project's committed
  # complexity policy. 12 of its findings are parameter-count > 8, but .pylintrc
  # explicitly disables too-many-arguments (R0913) because the threaded fallback /
  # fingerprint helpers legitimately thread many bound values; one is file-nloc >
  # 500 (tracked as its own decomposition ticket). Cyclomatic-complexity discipline
  # is still enforced on the library by pylint (mccabe via .pylintrc) and by the
  # dev-time codacy-cli lizard run at this project's own thresholds. Scope the cloud
  # Lizard tool away from the shipped library so its default-standard thresholds
  # don't red the gate on complexity the project has already decided to accept.
  lizard:
    exclude_paths:
      - "tests/**"
      - "tests-extensive/**"
      - "repo/plugin.video.nzbdav/**"
  # Codacy enables Trivy (dependency/vuln scanner) by default, but no patterns are
  # configured for it in this project, so it aborts ("Failed to configure Codacy
  # Trivy: no patterns configured") and reds both the Codacy Security Scan workflow
  # AND the app-side Codacy Static Code Analysis check. Our security coverage is
  # pylint/prospector/bandit here plus bandit.yml, semgrep.yml and codeql.yml in
  # CI, so disable the misconfigured engine rather than let it fail the pipeline.
  trivy:
    enabled: false
exclude_paths:
  - "plugin.video.nzbdav/resources/lib/ptt/**"
  - "repo/plugin.video.nzbdav/resources/lib/ptt/**"
  - "tests/**"
  - "tests-extensive/**"
  - "mockups/**"
  - "docs/**"
