[package]
name = "harness-runner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Drives orchestrator + fault-proxy scenarios with no Kodi in the loop."

[[bin]]
name = "harness-runner"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
reqwest = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Spawn + drive the orchestrator and fault-proxy as in-process libs
# when the scenarios run in `--in-process` mode; in `--docker` mode the
# binaries are managed by docker-compose and only the HTTP clients
# below are exercised.
orchestrator-server = { path = "../../../../crates/orchestrator-server" }
fault-proxy = { path = "../fault-proxy" }

[dev-dependencies]
