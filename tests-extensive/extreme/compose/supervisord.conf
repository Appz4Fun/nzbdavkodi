[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log

[program:xvfb]
command=Xvfb :1 -screen 0 1280x720x24
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/xvfb.err.log
stdout_logfile=/var/log/supervisor/xvfb.out.log

# x11vnc and websockify must bind beyond container-loopback: Docker's
# published ports (5902->5900, 6902->6901) DNAT to the container's eth0
# address, so a 127.0.0.1 bind is unreachable from the host. LAN exposure
# is prevented host-side by the 127.0.0.1: prefix on the port maps in
# docker-compose.yml, not by these binds.
[program:x11vnc]
command=x11vnc -display :1 -forever -nopw -shared -rfbport 5900
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/x11vnc.err.log
stdout_logfile=/var/log/supervisor/x11vnc.out.log
environment=DISPLAY=":1"

[program:novnc]
command=websockify --web=/usr/share/novnc 0.0.0.0:6901 localhost:5900
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/novnc.err.log
stdout_logfile=/var/log/supervisor/novnc.out.log

# Kodi runs under gdb so the recurring SIGSEGV during fault-induced player
# teardown produces a full thread backtrace. gdb runs the inferior at full
# speed until a signal; on SIGSEGV it appends all-thread backtraces to
# /var/log/kodi-gdb.log (collected by the test's _capture_diagnostics) and
# exits so supervisord's autorestart respawns Kodi as before.
[program:kodi]
command=bash -c "exec gdb -batch -return-child-result -ex run -ex 'thread apply all bt' --args /usr/lib/*/kodi/kodi.bin -fs >> /var/log/kodi-gdb.log 2>&1"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/kodi.err.log
stdout_logfile=/var/log/supervisor/kodi.out.log
environment=DISPLAY=":1",HOME="/root"

# Lightweight memory sampler: proves/disproves OOM when Kodi dies with
# no gdb signal record (SIGKILL is uncatchable; a cgroup group-kill
# takes gdb down too). Captured into the run dir by the diagnostics.
[program:memwatch]
command=bash -c "while true; do { date -u '+%%H:%%M:%%S'; free -m | sed -n 2p; ps -eo rss,comm --sort=-rss | head -4; } >> /var/log/supervisor/memwatch.log; sleep 15; done"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/memwatch.err.log
stdout_logfile=/var/log/supervisor/memwatch.out.log
