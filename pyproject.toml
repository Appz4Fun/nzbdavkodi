[project]
name = "plugin.video.nzbdav"
version = "0.1.0"
description = "Kodi addon — stream Usenet via NZBHydra2 + nzbdav WebDAV"
requires-python = ">=3.8"
license = "GPL-3.0-or-later"
authors = [{ name = "nzbdav" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"repo/plugin.video.nzbdav/resources/lib/ptt/*" = ["E501"]

[tool.black]
target-version = ["py38"]
line-length = 88

[tool.coverage.run]
# Store repo-relative filenames so the Cobertura report maps onto repo
# files for GitHub Code Quality. resources.lib resolves to
# repo/plugin.video.nzbdav/resources/lib (tests/kodi_mocks.py adds it to
# sys.path). Vendored PTT is third-party and excluded by policy.
relative_files = true
source = ["resources.lib"]
omit = ["*/resources/lib/ptt/*"]

[tool.coverage.report]
omit = ["*/resources/lib/ptt/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that spawn a real ffmpeg binary against a generated MKV; skipped by default, run via `just test-integration`",
    "functional: dev-box tests that use live services plus local playback simulation; skipped by default, run via `just functional-test`",
    "extreme: extreme functional test (20+ minutes, real services); skipped by default, run via `just extreme-functional-test`",
    "real_readahead: opt out of the autouse read-ahead-daemon suppression so the test exercises the real _start_readahead_prefetch spawn",
]
